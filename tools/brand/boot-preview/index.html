<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIONE 4 — Window B Boot Up / Boot Down (as built)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #f5f3ee; font-family: system-ui, 'Segoe UI', sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; }
      #stage { width: 100%; max-width: 1100px; aspect-ratio: 680 / 460; max-height: 78vh; }
      #stage svg { width: 100%; height: 100%; display: block; }
      .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
      button { padding: 8px 16px; border: 1px solid #555; border-radius: 8px; background: #111; color: #f5f3ee; font: inherit; cursor: pointer; }
      label, p { font-size: 14px; color: #aaa; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"></div>
      <div class="bar">
        <button id="up">Play boot up</button>
        <button id="slow">Clamp in slow motion (no sound)</button>
        <button id="down">Play boot down</button>
        <label><input type="checkbox" id="snd" checked /> Sound</label>
      </div>
      <p id="info">The animation built into AIONE 4 (src/lib/boot/windowB.ts), framed like the reference page. alpha.8: the letters about twice as large, in M PLUS Rounded 1c (B-5 rev. o).</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
