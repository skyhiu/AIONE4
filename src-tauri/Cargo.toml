[package]
name = "aione4"
# Mirrors package.json (the one place the version is set). build.rs fails the build if
# they differ, and the UI and logs read it from the core.
version = "4.0.0-alpha.33"
description = "AIONE 4: a fullscreen, controller-first game launcher for Windows"
authors = ["skyhiu"]
edition = "2021"
rust-version = "1.91"
license = "UNLICENSED"
publish = false

[lib]
name = "aione4_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
serde_json = "=1.0.151"

[dependencies]
# D-007: tile-sized copies of the game pictures (decode PNG / JPEG / ICO / BMP / WebP / GIF; encode JPEG / PNG).
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp", "gif"] }
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-single-instance = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_UI_Accessibility",
  "Win32_System_Power",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "=3.27.0"

# D-010: the picture libraries at full speed (the app stays size-optimised; measured: scaling
# about 1.5x faster than at opt-level "s").
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
